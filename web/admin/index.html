<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLC IPTV · Admin</title><style>body{font:16px Arial,sans-serif;background:#100c1e;color:#eee;margin:24px auto;max-width:950px;padding:0 20px}h1{color:#cdb5ff}section{background:#211934;border:1px solid #453267;border-radius:14px;padding:20px;margin:18px 0}input,select,button{padding:10px;margin:5px;background:#130f25;color:white;border:1px solid #7459a0;border-radius:7px}button{background:#673cb9;cursor:pointer}label{display:inline-block;margin:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #524267;text-align:left}small{color:#aaa}#msg{white-space:pre-wrap;color:#eacbff}</style></head><body><h1>VLC IPTV · Central Admin</h1><p><small>Local development prototype · Do not expose to the Internet yet</small></p><section><h2>Admin access</h2><input type="password" id="key" placeholder="VLC_ADMIN_KEY" size="42"><button id="connect">Connect</button><p id="msg"></p></section><section><h2>Add Xtream subscription</h2><form id="add"><input name="label" placeholder="Account label" required><input name="host" placeholder="https://provider.example:port" required><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Add securely</button></form><h3>Accounts</h3><div id="accounts">Connect first</div></section><section><h2>Pending pairing codes</h2><div id="pending"></div><h2>Approved devices</h2><div id="devices"></div></section><script>
(function(){'use strict';var key='',state=null;var $=function(id){return document.getElementById(id);};function say(s){$('msg').textContent=s;}function el(tag,text){var x=document.createElement(tag);x.textContent=text||'';return x;}async function call(path,data){var r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:data?JSON.stringify(data):undefined});var v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v;}function checkBox(name,checked){var l=el('label');var c=document.createElement('input');c.type='checkbox';c.checked=checked;l.appendChild(c);l.appendChild(document.createTextNode(name));return {label:l,input:c};}function accountPicker(selected){var s=document.createElement('select');s.multiple=true;s.size=Math.max(2,Math.min(6,state.accounts.length));state.accounts.forEach(function(a){var o=document.createElement('option');o.value=a.id;o.textContent=a.label;o.selected=(selected||[]).indexOf(a.id)!==-1;s.appendChild(o);});return s;}function chosen(s){return Array.from(s.options).filter(function(o){return o.selected;}).map(function(o){return o.value;});}async function refresh(){state=await call('/api/admin/state');$('accounts').replaceChildren();state.accounts.forEach(function(a){$('accounts').appendChild(el('p',a.label+' · '+a.host+' · '+a.username));});$('pending').replaceChildren();state.pending.forEach(function(p){var wrap=el('div');wrap.appendChild(el('strong',p.name+' ('+p.platform+') code: '+p.code+' '));var sel=accountPicker([]);wrap.appendChild(sel);var live=checkBox('Live',true),movies=checkBox('Movies',true),series=checkBox('Series',true);[live,movies,series].forEach(function(c){wrap.appendChild(c.label);});var b=el('button','Approve');b.onclick=async function(){try{await call('/api/admin/pair/approve',{code:p.code,accounts:chosen(sel),live:live.input.checked,movies:movies.input.checked,series:series.input.checked});await refresh();}catch(e){say(e.message);}};wrap.appendChild(b);$('pending').appendChild(wrap);});$('devices').replaceChildren();state.devices.forEach(function(d){var wrap=el('div');wrap.appendChild(el('h3',d.name+' ('+d.platform+')'));var sel=accountPicker(d.accounts);wrap.appendChild(sel);var live=checkBox('Live',d.permissions.live),movies=checkBox('Movies',d.permissions.movies),series=checkBox('Series',d.permissions.series);[live,movies,series].forEach(function(c){wrap.appendChild(c.label);});var save=el('button','Save access');save.onclick=async function(){try{await call('/api/admin/devices/assign',{deviceId:d.id,accounts:chosen(sel),live:live.input.checked,movies:movies.input.checked,series:series.input.checked});say('Access saved');await refresh();}catch(e){say(e.message);}};wrap.appendChild(save);var revoke=el('button','Revoke device');revoke.onclick=async function(){if(!confirm('Revoke this device?'))return;await call('/api/admin/devices/revoke',{deviceId:d.id});await refresh();};wrap.appendChild(revoke);$('devices').appendChild(wrap);});} $('connect').onclick=async function(){key=$('key').value;try{await refresh();say('Connected.');}catch(e){say(e.message);}};$('add').onsubmit=async function(e){e.preventDefault();var f=new FormData(this);try{await call('/api/admin/accounts',Object.fromEntries(f.entries()));this.reset();say('Account saved encrypted at rest.');await refresh();}catch(err){say(err.message);}};setInterval(function(){if(key)refresh().catch(function(){});},15000);})();
</script></body></html>
